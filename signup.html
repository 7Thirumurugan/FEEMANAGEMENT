<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #20B2AA;
            --primary-hover: #1E9C96;
            --secondary-color: #6c757d;
            --light-bg: #f8f9fa;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --input-focus: 0 0 0 0.25rem rgba(32, 178, 170, 0.25);
            --transition: all 0.3s ease;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4f0f9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        .signup-container {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
        }
        
        .signup-container:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo i {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        h2 {
            color: #2c3e50;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1.8rem;
            position: relative;
        }
        
        h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--primary-color);
            margin: 0.5rem auto 0;
            border-radius: 3px;
        }
        
        .form-control {
            height: 48px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding-left: 15px;
            transition: var(--transition);
            margin-bottom: 1.2rem;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: var(--input-focus);
        }
        
        .input-group {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-color);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            height: 48px;
            border-radius: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: var(--transition);
            margin-top: 0.5rem;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        #message {
            min-height: 24px;
            font-size: 14px;
            margin: 1rem 0;
            padding: 0.5rem;
            border-radius: 6px;
        }
        
        .text-danger {
            background-color: rgba(220, 53, 69, 0.1);
            padding: 0.5rem;
            border-radius: 6px;
        }
        
        .text-success {
            background-color: rgba(25, 135, 84, 0.1);
            padding: 0.5rem;
            border-radius: 6px;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--secondary-color);
            font-size: 14px;
        }
        
        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            transition: var(--transition);
            font-weight: 500;
        }
        
        .login-link a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        
        .password-strength {
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin-top: -10px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .strength-meter {
            height: 100%;
            width: 0%;
            transition: var(--transition);
        }
        
        /* Two column layout for larger screens */
        @media (min-width: 768px) {
            .row-cols-md-2 > * {
                flex: 0 0 auto;
                width: 48%;
            }
            
            .name-fields {
                display: flex;
                gap: 4%;
            }
            
            .name-fields .mb-3 {
                width: 48%;
            }
        }
        
        /* Loading spinner */
        .spinner-border {
            display: none;
            width: 1.2rem;
            height: 1.2rem;
            border-width: 0.15em;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <i class="fas fa-user-plus"></i>
        </div>
        <h2>Create Your Account</h2>
        <form id="signupForm">
            <div class="name-fields">
                <div class="mb-3">
                    <input type="text" id="firstName" class="form-control uppercase-field" placeholder="First Name" required>
                </div>
                <div class="mb-3">
                    <input type="text" id="lastName" class="form-control uppercase-field" placeholder="Last Name" required>
                </div>
            </div>
            
            <div class="mb-3">
                <input type="email" id="email" class="form-control" placeholder="Email Address" required>
            </div>
            
            <div class="mb-3">
                <input type="tel" id="mobile" class="form-control" placeholder="Mobile Number" required>
            </div>
            
            <div class="mb-3">
                <input type="text" id="registerNumber" class="form-control" placeholder="Register Number" required>
            </div>
            
            <div class="row row-cols-md-2">
                <div class="mb-3">
                    <input type="text" id="course" class="form-control uppercase-field" placeholder="Course" required>
                </div>
                <div class="mb-3">
                    <input type="text" id="department" class="form-control uppercase-field" placeholder="Department">
                </div>
            </div>
            
            <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="Password" required>
                <div class="password-strength">
                    <div class="strength-meter" id="passwordStrength"></div>
                </div>
            </div>
            
            <div class="mb-3">
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
            </div>
            
            <button type="submit" id="signupBtn" class="btn btn-primary w-100">
                <span id="btnText">Create Account</span>
                <span class="spinner-border spinner-border-sm" id="spinner" role="status" aria-hidden="true"></span>
            </button>
            
            <p id="message" class="text-center mt-3"></p>
            
            <div class="login-link">
                Already have an account? <a href="signin.html">Sign In</a>
            </div>
        </form>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
