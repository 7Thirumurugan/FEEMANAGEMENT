<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --primary-hover: #43A047;
            --secondary-color: #8BC34A;
            --light-gray: #f8f9fa;
            --dark-gray: #6c757d;
            --success-color: #4CAF50;
            --error-color: #F44336;
            --box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f1f8e9 0%, #dcedc8 100%);
            padding: 20px;
        }
        
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 420px;
            text-align: center;
            transition: var(--transition);
            border-top: 4px solid var(--primary-color);
            position: relative;
        }
        
        .container:hover {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        h2 {
            color: #2E7D32;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }
        
        p.subtitle {
            color: var(--dark-gray);
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-size: 14px;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 15px;
            transition: var(--transition);
        }
        
        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }
        
        input::placeholder {
            color: #adb5bd;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }
        
        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.secondary {
            background-color: var(--dark-gray);
        }
        
        button.secondary:hover {
            background-color: #5a6268;
        }
        
        .message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .error {
            background-color: rgba(244, 67, 54, 0.1);
            color: var(--error-color);
            border-left: 4px solid var(--error-color);
        }
        
        .success {
            background-color: rgba(76, 175, 80, 0.1);
            color: var(--success-color);
            border-left: 4px solid var(--success-color);
        }
        
        #otpSection {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .password-strength {
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .strength-meter {
            height: 100%;
            width: 0%;
            transition: var(--transition);
            background: var(--primary-color);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            margin-bottom: 25px;
        }
        
        .logo img {
            height: 50px;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: var(--dark-gray);
            cursor: pointer;
            transition: var(--transition);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .close-btn:hover {
            color: var(--error-color);
            background-color: rgba(244, 67, 54, 0.1);
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="close-btn" onclick="window.location.href='signin.html'">×</div>
        
        <div class="logo">
            <!-- Add your logo here -->
            <!-- <img src="logo.png" alt="Company Logo"> -->
        </div>
        <h2>Forgot Password</h2>
        <p class="subtitle">Enter your email to receive a password reset OTP</p>
        
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        
        <button onclick="sendOTP()">Send OTP</button>
        
        <div id="message" class="message"></div>
        
        <div id="otpSection">
            <div class="input-group">
                <label for="otp">OTP Code</label>
                <input type="text" id="otp" placeholder="Enter 6-digit OTP" required>
            </div>
            
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Create new password" required>
                <div class="password-strength">
                    <div class="strength-meter" id="passwordStrength"></div>
                </div>
            </div>
            
            <button onclick="resetPassword()">Reset Password</button>
            <button onclick="resendOTP()" class="secondary">Resend OTP</button>
            
            <div id="otpMessage" class="message"></div>
        </div>
    </div>

    <script>
        let userEmail = '';
        
        async function sendOTP() {
            const email = document.getElementById('email').value;
            const messageEl = document.getElementById('message');
            
            if (!email) {
                messageEl.textContent = 'Please enter your email';
                messageEl.className = 'error';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:3001/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageEl.textContent = data.message;
                    messageEl.className = 'success';
                    userEmail = email;
                    document.getElementById('otpSection').style.display = 'block';
                } else {
                    messageEl.textContent = data.message || 'Error sending OTP';
                    messageEl.className = 'error';
                }
            } catch (error) {
                messageEl.textContent = 'Error connecting to server';
                messageEl.className = 'error';
                console.error('Error:', error);
            }
        }
        
        async function resetPassword() {
            const otp = document.getElementById('otp').value;
            const newPassword = document.getElementById('newPassword').value;
            const otpMessageEl = document.getElementById('otpMessage');
            
            if (!otp || !newPassword) {
                otpMessageEl.textContent = 'Please enter OTP and new password';
                otpMessageEl.className = 'error';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:3001/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: userEmail, 
                        otp, 
                        newPassword 
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    otpMessageEl.textContent = data.message;
                    otpMessageEl.className = 'success';
                    setTimeout(() => {
                        window.location.href = 'signin.html';
                    }, 2000);
                } else {
                    otpMessageEl.textContent = data.message || 'Error resetting password';
                    otpMessageEl.className = 'error';
                }
            } catch (error) {
                otpMessageEl.textContent = 'Error connecting to server';
                otpMessageEl.className = 'error';
                console.error('Error:', error);
            }
        }
        
        async function resendOTP() {
            try {
                const response = await fetch('http://localhost:3001/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                
                const data = await response.json();
                const otpMessageEl = document.getElementById('otpMessage');
                
                if (response.ok) {
                    otpMessageEl.textContent = data.message;
                    otpMessageEl.className = 'success';
                } else {
                    otpMessageEl.textContent = data.message || 'Error resending OTP';
                    otpMessageEl.className = 'error';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('otpMessage').textContent = 'Error connecting to server';
                document.getElementById('otpMessage').className = 'error';
            }
        }
    </script>
</body>
</html>
